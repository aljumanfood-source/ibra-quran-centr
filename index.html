function bindTasmeeForm(){
  bindCommon();
  if(!window.__newTrackItems) window.__newTrackItems = [];
  if(!window.__newTrackMeta) window.__newTrackMeta = { amount:'', duration:30, start:todayStr() };
  if(!window.__newItemMeta) window.__newItemMeta = { label:'', detail:'', date:todayStr(), buffer:false };

  const trackAmount = document.getElementById('track_amount');
  const trackDuration = document.getElementById('track_duration');
  const trackStart = document.getElementById('track_start');
  if(trackAmount) trackAmount.addEventListener('input', ()=>{ window.__newTrackMeta.amount = trackAmount.value; });
  if(trackDuration) trackDuration.addEventListener('input', ()=>{ window.__newTrackMeta.duration = parseInt(trackDuration.value)||30; });
  if(trackStart) trackStart.addEventListener('input', ()=>{ window.__newTrackMeta.start = trackStart.value; });

  const itemLabel = document.getElementById('item_label');
  const itemDetail = document.getElementById('item_detail');
  const itemDate = document.getElementById('item_date');
  const itemBuffer = document.getElementById('item_buffer');
  if(itemLabel) itemLabel.addEventListener('input', ()=>{ window.__newItemMeta.label = itemLabel.value; });
  if(itemDetail) itemDetail.addEventListener('input', ()=>{ window.__newItemMeta.detail = itemDetail.value; });
  if(itemDate) itemDate.addEventListener('input', ()=>{ window.__newItemMeta.date = itemDate.value; });
  if(itemBuffer) itemBuffer.addEventListener('change', ()=>{ window.__newItemMeta.buffer = itemBuffer.checked; });

  const addBtn = document.getElementById('addItemBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const label = (itemLabel?.value||'').trim();
      const detail = (itemDetail?.value||'').trim();
      const date = itemDate?.value || todayStr();
      const isBuffer = itemBuffer?.checked || false;
      if(!label){ showToast('العنوان مطلوب'); return; }
      window.__newTrackItems.push({ id:uid(), label, detail, date, isBuffer, rating:0, reviewNotes:'', doneDate:null });
      // إعادة تهيئة حقول العنصر فقط (وليس المقدار/الزمن العام) لتسهيل إدخال العنصر التالي
      window.__newItemMeta = { label:'', detail:'', date, buffer:false };
      render();
    });
  }
  document.querySelectorAll('[data-remove-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-remove-item'));
      window.__newTrackItems.splice(i,1);
      render();
    });
  });
  const saveTrackBtn = document.getElementById('saveTrackBtn');
  if(saveTrackBtn){
    saveTrackBtn.addEventListener('click', async ()=>{
      const amount = (trackAmount?.value||'').trim();
      const durationDays = parseInt(trackDuration?.value)||30;
      const startDate = trackStart?.value || todayStr();
      if(!amount){ showToast('المقدار مطلوب'); return; }
      if(!window.__newTrackItems.length){ showToast('أضف عنصرًا واحدًا على الأقل للخطة'); return; }

      toastSave(ok, 'تم حفظ المسار');
      window.__newTrackItems = [];
      window.__newTrackMeta = null;
      window.__newItemMeta = null;
      currentView = 'category';
      render();
    });
  }
}

function renderStars(value){

  return html;
}

// ========== المهمة التلقائية اليومية: تلاوة جزء من القرآن حسب التقويم الهجري ==========
function getQuranDailyTaskForToday(){
  const today = todayStr();
  const hijri = gregorianToHijri1448(today);
  if(!hijri) return null;
  const juzList = hijriDayToJuzList(hijri);
  if(!juzList.length) return null;
  const hijriLabel = toAR(hijri.day)+' '+hijri.monthName+' ١٤٤٨هـ';
  const title = juzList.length > 1
    ? '📖 تلاوة الجزء '+toAR(juzList[0])+' و'+toAR(juzList[1])+' ('+hijriLabel+')'
    : '📖 تلاوة الجزء '+toAR(juzList[0])+' ('+hijriLabel+')';
  return { id:'quran_daily_'+today, title, date:today, autoGenerated:true };
}

// كل مهام المالك الحالي المطلوب عرضها الآن: مهام اليوم + المتأخرة غير المنجزة + مهمة التلاوة اليومية
function getOwnerTasksBoard(){
  const ownerKey = getTaskOwnerKey();
  const today = todayStr();
  const mine = tasksData.filter(t=>t.ownerKey===ownerKey);
  let board = mine.slice();
  const quranTask = getQuranDailyTaskForToday();
  if(quranTask && !mine.some(t=>t.id===quranTask.id)){
    board.push(Object.assign({ownerKey, done:false}, quranTask));
  }
  // تنبيه: حلقات المشرف الحالي (هو فقط) التي لم يُسجَّل حضورها بعد
  if(currentUser?.name){
    const { rows: myMissing } = getMissingAttendanceRows(c => c.teacher === currentUser.name);
    if(myMissing.length){
      board.push({
        id: 'missing_att_alert',
        ownerKey,
        title: '⚠️ حلقات لم تقم بتسجيل حضورها ('+myMissing.length+')',
        date: today,
        done: false,
        autoGenerated: true,
        isAttendanceAlert: true,
        targetCircleId: myMissing[0].circle.id,
      });
    }
  }
  return board.filter(t => t.date === today || (t.date < today && !t.done))
              .sort((a,b)=> a.date.localeCompare(b.date));
}

function renderTaskRow(t, today){
  const isOverdue = t.date < today && !t.done;
  const color = t.done ? 'var(--muted)' : (isOverdue ? 'var(--danger)' : 'var(--teal-dark)');
  const dateLabel = t.date===today ? 'اليوم' : fmtDate(t.date);

  if(t.isAttendanceAlert){
    // تنبيه الحضور: بلا زر "تم" — النقر على الصف بالكامل ينقل لتسجيل حضور إحدى الحلقات المتأخرة
    return '<div data-att-alert-circle="'+t.targetCircleId+'" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border);">'
      + '<div style="min-width:0;">'
      +   '<div style="font-weight:bold;color:var(--danger);font-size:14px;">'+escapeHtml(t.title)+'</div>'
      +   '<div style="font-size:11px;color:var(--muted);">اضغط لتسجيل الحضور</div>'
      + '</div>'
      + '<span style="color:var(--danger);font-size:18px;">›</span>'
      + '</div>';
  }

  const doneBtn = t.done
    ? '<span style="color:#1a8a5a;font-weight:bold;font-size:13px;">✅ تم</span>'
    : '<button data-task-done="'+t.id+'" data-task-title="'+escapeAttr(t.title)+'" data-task-date="'+t.date+'" data-task-auto="'+(t.autoGenerated?'1':'0')+'" class="btn btn-gold" style="padding:5px 16px;font-size:12.5px;">تم</button>';
  const titleStyle = 'font-weight:bold;color:'+color+';font-size:14px;'+(t.done?'text-decoration:line-through;':(t.linkedTrackId?'text-decoration:underline;cursor:pointer;':''));
  const titleAttrs = (t.linkedTrackId ? ' data-task-open="'+t.linkedTrackId+'" data-task-open-student="'+t.linkedStudentId+'"' : '') + ' style="'+titleStyle+'"';
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border);'+(t.done?'opacity:.55;':'')+'">'
    + '<div style="min-width:0;">'
    +   '<div'+titleAttrs+'>'+escapeHtml(t.title)+'</div>'
    +   '<div style="font-size:11px;color:'+(isOverdue?'var(--danger)':'var(--muted)')+';">'+dateLabel+(isOverdue?' — متأخرة':'')+'</div>'
    + '</div>'
    + doneBtn
    + '</div>';
}

// ---- شبكة الأجزاء ----
function toAR(n){ return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]); }

function juzProgress(juzObj){
  if(!juzObj || !juzObj.ready) return 0;
  if(juzObj.isJuzAmma){
    const data = supQuranData[supQKey()]?.juzAmma || {};
    const done = JUZ_AMMA_SURAHS.filter(n=>(data[n]||0)>0).length;
    return Math.round(done/JUZ_AMMA_SURAHS.length*100);
  }
  const cycles = getSurahCycles('juz'+juzObj.juz);
  const cycle = cycles[cycles.length-1] || {};
  const total = juzObj.ahzab.reduce((s,h)=>s+h.arba3.length,0);
  if(!total) return 0;
  const done = juzObj.ahzab.reduce((s,h)=>s+h.arba3.filter(r=>(cycle[r.key]||0)>0).length,0);
  return Math.round(done/total*100);
}

function renderSupQuranGrid(){
  const cells = JUZ_QURAN.slice(1).map(j=>{
    const pct = juzProgress(j);
    const bg = !j.ready ? '#e8e8e8'
      : pct===100 ? 'linear-gradient(135deg,#1a6b3a,#27ae60)'
      : pct>0 ? 'linear-gradient(135deg,#b7950b,#d4ac0d)'
      : 'linear-gradient(135deg,var(--teal),var(--teal-dark))';
    const opacity = j.ready ? '1' : '0.45';
    return '<div data-juz="'+j.juz+'" style="cursor:'+(j.ready?'pointer':'default')+';border-radius:12px;background:'+bg+';padding:12px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:'+opacity+';transition:.15s;">'
      + '<div style="color:#fff;font-weight:bold;font-size:12px;">'+(j.juz===30?'جزء عمّ':'الجزء')+'</div>'
      + '<div style="color:#fff;font-size:18px;font-weight:bold;">'+(j.juz===30?'':toAR(j.juz))+'</div>'
      + (pct>0&&pct<100?'<div style="font-size:10px;color:rgba(255,255,255,.8);">'+pct+'%</div>':'')
      + (pct===100?'<div style="font-size:14px;">✅</div>':'')
      + '</div>';
  }).join('');

  return '<div class="card"><div class="student-header"><h2>📖 القرآن الكريم</h2>'

function renderJuzDetail(){
  const j = JUZ_QURAN[currentJuzIdx];
  if(!j) return renderSupQuranGrid();

  const backBtn = '<button onclick="window.__supTab=\'quran\';render();" class="btn btn-outline" style="font-size:12px;padding:5px 10px;">← رجوع للأجزاء</button>';

  // جزء عمّ
  if(j.isJuzAmma){
    const data = (supQuranData[supQKey()]||{}).juzAmma || {};
    const SCOL = {1:'#c0392b',2:'#e67e22',3:'#f1c40f',4:'#27ae60',5:'#1a8a5a'};
    const SLBL = {1:'ضعيف',2:'مقبول',3:'جيد',4:'جيد جداً',5:'ممتاز'};
    let rows = JUZ_AMMA_SURAHS.map(name=>{
      const r = data[name]||0;
      let stars = '<div style="display:flex;gap:2px;direction:ltr;">';
      for(let i=1;i<=5;i++) stars += '<span class="sqa-star" data-surah="'+escapeAttr(name)+'" data-val="'+i+'" style="font-size:18px;cursor:pointer;color:'+(i<=r?(SCOL[r]||'#d8d8d8'):'#d8d8d8')+';">★</span>';
      stars += '</div>';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);">'
        + '<div><div style="font-size:13px;">سورة '+escapeHtml(name)+'</div>'
        + (r?'<div style="font-size:11px;color:'+SCOL[r]+';">'+SLBL[r]+'</div>':'<div class="small-muted" style="font-size:11px;">لم يُراجع</div>')
        + '</div>'+stars+'</div>';
    }).join('');
    const done = JUZ_AMMA_SURAHS.filter(n=>(data[n]||0)>0).length;
    return '<div class="card"><div class="student-header"><h2>جزء عمّ</h2>'+backBtn+'</div>'
      + '<div class="small-muted" style="margin-bottom:8px;">'+done+'/'+JUZ_AMMA_SURAHS.length+' سورة تم تقييمها</div>'
      + '<div style="max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px 10px;">'+rows+'</div></div>';
  }

  // جزء عادي
  const SCOL = {1:'#c0392b',2:'#e67e22',3:'#f1c40f',4:'#27ae60',5:'#1a8a5a'};
  const SLBL = {1:'ضعيف',2:'مقبول',3:'جيد',4:'جيد جداً',5:'ممتاز'};
  const cycles = getSurahCycles('juz'+j.juz);
  const cidx   = window.__supQuranCycle !== undefined ? window.__supQuranCycle : cycles.length-1;
  const cycle  = cycles[cidx]||{};
  const total  = j.ahzab.reduce((s,h)=>s+h.arba3.length,0);
  const done   = j.ahzab.reduce((s,h)=>s+h.arba3.filter(r=>(cycle[r.key]||0)>0).length,0);
  const complete = total>0 && done===total;

  const cycleTabs = cycles.map((c,i)=>'<button onclick="window.__supQuranCycle='+i+';document.getElementById(\'juz-content\').innerHTML=renderJuzRows();bindJuzStars();" style="padding:4px 9px;border:none;border-radius:8px;cursor:pointer;font-size:11px;background:'+(i===cidx?'var(--teal)':'var(--border)')+';color:'+(i===cidx?'#fff':'var(--text)')+';">دورة '+(i+1)+(isCycleComplete(c,j)?'✅':'')+'</button>').join('');

  let rows = j.ahzab.map(h=>h.arba3.map(r=>{
    const rating = cycle[r.key]||0;
    let stars = '<div style="display:flex;gap:3px;direction:ltr;">';
    for(let i=1;i<=5;i++) stars += '<span class="sq-star" data-key="'+r.key+'" data-juz="'+j.juz+'" data-cidx="'+cidx+'" data-val="'+i+'" style="font-size:20px;cursor:pointer;color:'+(i<=rating?(SCOL[rating]):'#d8d8d8')+';">★</span>';
    stars += '</div>';
    const isHizbStart = r.key.endsWith('_r0');
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--border);'+(isHizbStart?'background:var(--teal-pale);':'')+'">'
      + '<div><div style="font-size:13px;"'+( isHizbStart?' style="font-weight:bold;"':'')+'>'+r.label+'</div>'
      + (rating?'<div style="font-size:11px;color:'+SCOL[rating]+';">'+SLBL[rating]+'</div>':'<div class="small-muted" style="font-size:11px;">لم يُراجع</div>')
      + '</div>'+stars+'</div>';
  }).join('')).join('');

  return '<div class="card"><div class="student-header"><h2>'+j.name+'</h2>'+backBtn+'</div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">'+cycleTabs+'</div>'
    + '<div class="small-muted" style="margin-bottom:8px;">'+done+'/'+total+' قسم'+(complete?' — ✅ مكتمل':'')+'</div>'
    + (complete?'<button id="newCycleBtn" class="btn btn-gold" style="width:100%;margin-bottom:10px;">🔄 بدء دورة جديدة</button>':'')
    + '<div id="juz-content" style="max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px 10px;">'+rows+'</div></div>';
}

function bindSupPage(){
  bindCommon();

    el.addEventListener('click',()=>{
      const t = el.getAttribute('data-sup-tab');
      window.__supTab = t; window.__repTab=null; window.__supQuranCycle=undefined; render();
    });
  });
  document.querySelectorAll('[data-rep-tab]').forEach(el=>{
    el.addEventListener('click',()=>{ window.__repTab=el.getAttribute('data-rep-tab'); render(); });
  });
  document.querySelectorAll('[data-juz]').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.getAttribute('data-juz')), j=JUZ_QURAN[idx];
      if(!j||!j.ready) return;
      currentJuzIdx=idx; window.__supTab='juzDetail'; window.__supQuranCycle=undefined; render();
    });
  });
  // السلوك
  document.querySelectorAll('[data-beh-stu]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const sid=el.getAttribute('data-beh-stu'), val=el.getAttribute('data-beh-val');
      if(!behaviorData[sid]) behaviorData[sid]={};
      behaviorData[sid].rating=val; behaviorData[sid].date=todayStr();
      await saveBehavior(); showToast('✅ تم حفظ تقييم السلوك'); render();
    });
  });
  // الحضور
  const attSel=document.getElementById('att-sess-sel');
  if(attSel){ attSel.addEventListener('change',()=>{ window.__attSessId=attSel.value; render(); }); }
  // نموذج الاختبار
  const saveEF=document.getElementById('saveExamFormBtn');
  if(saveEF){ saveEF.addEventListener('click', async ()=>{
    const name=document.getElementById('ef_name').value.trim(), subj=document.getElementById('ef_subj').value, total=document.getElementById('ef_total').value.trim();
    if(!name){showToast('اسم النموذج مطلوب');return;}
    if(!total){showToast('الدرجة الكاملة مطلوبة');return;}
    testForms.push({id:uid(),name,subject:subj,total:parseFloat(total),ownerKey:supQKey()});
    await saveTestForms(); toastSave(true,'تم حفظ النموذج'); window.__repTab='exam'; render();
  }); }
  document.querySelectorAll('[data-del-form]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('حذف هذا النموذج وجميع درجاته؟')) return;
      const fid=el.getAttribute('data-del-form');
      testForms=testForms.filter(f=>f.id!==fid); testGrades=testGrades.filter(g=>g.formId!==fid);
      await saveTestForms(); await saveTestGrades(); render();
    });
  });
  // الدرجات
  const grdSubj=document.getElementById('grd-subj');
  if(grdSubj){ grdSubj.addEventListener('change',()=>{ window.__gradeSubj=grdSubj.value; window.__gradeForm=''; render(); }); }
  const grdForm=document.getElementById('grd-form');
  if(grdForm){ grdForm.addEventListener('change',()=>{ window.__gradeForm=grdForm.value; render(); }); }
  const saveGrd=document.getElementById('saveGradesBtn');
  if(saveGrd){ saveGrd.addEventListener('click', async ()=>{
    const formId=window.__gradeForm, ownerKey=supQKey(), date=todayStr();
    document.querySelectorAll('.grade-input').forEach(inp=>{
      const g=inp.value.trim(); if(!g) return;
      testGrades.push({id:uid(),formId,studentId:inp.getAttribute('data-stu'),grade:g,date,ownerKey});
    });
    await saveTestGrades(); showToast('✅ تم حفظ الدرجات'); window.__gradeForm=''; render();
  }); }
  bindSupTabContent();
}

// ========== الحلقات (CIRCLES) ==========
function splitTopicLines(topic){
  const t = (topic||'').trim();
  const parts = t.split('—').map(x=>x.trim()).filter(Boolean);
  if(parts.length>=2) return {top:parts[0], bottom:parts.slice(1).join(' — ')};
  return {top:t, bottom:''};
}

const CIRCLES_KEY_BOYS = 'circles_v1';
const CIRCLES_KEY_GIRLS = 'circles_girls_v1';
let CIRCLES_KEY = CIRCLES_KEY_BOYS;
const CIRCLE_ATTENDANCE_KEY = 'circle_attendance_v1';
let circlesData = [];
let circleAttendanceData = [];
let currentCircleId = null;
let currentExamId = null;
let circleAttendanceMarks = {};

async function loadCircles(){
  try{ const r = await storeGet(CIRCLES_KEY); circlesData = r ? JSON.parse(r) : []; }
  catch(e){ circlesData = []; }
  // تصحيح اسم المشرف في البيانات المخزّنة مسبقًا
  try{
    const fixed = await storeGet('teacher_name_fix_v1');
    if(!fixed){
      let changed = false;
      circlesData.forEach(c=>{
        if(c.teacher==='أسعد بن محمد الحبسي'){ c.teacher='أسعد بن عبيد الحبسي'; changed=true; }
      });
      if(changed) await saveCirclesRaw();
      await storeSet('teacher_name_fix_v1','1');
    }
  }catch(e){}
}
async function saveCirclesRaw(){
  return await storeSet(CIRCLES_KEY, JSON.stringify(circlesData));
}
async function loadCircleAttendance(){
  try{ const r = await storeGet(CIRCLE_ATTENDANCE_KEY); circleAttendanceData = r ? JSON.parse(r) : []; }
  catch(e){ circleAttendanceData = []; }
}

// أيام الأسبوع (الأحد=٠ ... السبت=٦) التي تُقام فيها كل مادة حسب الجدول الرسمي
// ملاحظة: حلقات الفجر غير مشمولة (الجدول يغطي فقط فترات ٨:٠٠ - ١٢:٣٠)
const SUBJECT_DAYS = {

async function ensureMultaqaAlMarakizEvents(){

async function ensureAllTrack1ExcellentRating(){
  try{
    if(await storeGet('all_track1_excellent_rating_v2')) return;

    const excludedStudent = students.find(x=>x.name.trim()==='حيان بن مازن الطوقي');
    const excludedId = excludedStudent ? excludedStudent.id : null;

    // كل الطلاب الذين لديهم "المسار ١"
    const studentIdsWithTrack1 = new Set(
      tasmeeData.filter(t=>t.trackNumber===1).map(t=>t.studentId)
    );

    const latest = await storeGet(JUZ_AMMA_KEY);
    let all = latest ? JSON.parse(latest) : Object.assign({}, juzAmmaProgress);

    studentIdsWithTrack1.forEach(studentId=>{
      if(studentId === excludedId) return; // استثناء حيان بن مازن الطوقي
      if(!all[studentId]) all[studentId] = {};
      JUZ_AMMA_SURAHS.forEach(name=>{ all[studentId][name] = 5; });
    });

    // تراجع احترازي: إن كان قد طُبِّق عليه تقييم "ممتاز" في تشغيل سابق، أزِله الآن
    if(excludedId && all[excludedId]){
      JUZ_AMMA_SURAHS.forEach(name=>{ delete all[excludedId][name]; });
    }

    juzAmmaProgress = all;
    await storeSet(JUZ_AMMA_KEY, JSON.stringify(all));

    await storeSet('all_track1_excellent_rating_v2','1');
  }catch(e){}
}

async function ensureStudentNumbers(){
  try{
    if(await storeGet('student_numbers_seeded_v1')) return;

    // خريطة الاسم -> الرقم الأصلي من القوائم المرجعية إن وُجد
    const nameToNum = {};
    FIRST_YEAR_LIST.forEach(({num, name})=>{ if(name) nameToNum[name.trim()] = num; });
    FORMER_LIST.forEach(({num, name})=>{ if(name) nameToNum[name.trim()] = num; });

    const usedNumbers = new Set(Object.values(nameToNum));
    let nextFresh = Math.max(0, ...Array.from(usedNumbers)) + 1;

    const latest = await storeGet(STORAGE_KEY);
    let all = latest ? JSON.parse(latest) : students.slice();
    let changed = false;

    // نرتّب أبجديًا لضمان تعيين ثابت وقابل للتكرار لمن ليس له رقم مرجعي
    const sorted = all.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    sorted.forEach(st=>{
      if(st.studentNumber) return;
      const mapped = nameToNum[st.name.trim()];
      const idx = all.findIndex(x=>x.id===st.id);
      if(mapped){
        all[idx].studentNumber = mapped;
      } else {
        while(usedNumbers.has(nextFresh)) nextFresh++;
        all[idx].studentNumber = nextFresh;
        usedNumbers.add(nextFresh);
      }
      changed = true;
    });

    if(changed){
      students = all;
      await storeSet(STORAGE_KEY, JSON.stringify(all));
    }
    await storeSet('student_numbers_seeded_v1','1');
  }catch(e){}
}

    if(await storeGet('fajr_tracks_seeded_v1')) return;

    const dateFrom = '2026-06-28';

    const totalDays = Math.max(1, Math.round((new Date(dateTo)-new Date(dateFrom))/86400000));

async function seedInitialAttendance(){
  try{
    if(await storeGet('initial_attendance_seed_v1')) return;
    const startDate = '2026-06-28';
    const endDate = todayStr();
    const latest = await storeGet(CIRCLE_ATTENDANCE_KEY);
    let allAtt = latest ? JSON.parse(latest) : circleAttendanceData.slice();
    let added = false;
    circlesData.forEach(c=>{
      const days = SUBJECT_DAYS[c.subject];
      if(!days) return; // حلقات الفجر أو أي مادة غير مشمولة بهذا الجدول
      let d = startDate;
      while(d <= endDate){
        const wd = new Date(d+'T00:00:00Z').getUTCDay();
        if(days.includes(wd)){
          const exists = allAtt.some(a=>a.circleId===c.id && a.date===d);
          if(!exists){
            const attendance = {};
            (c.studentIds||[]).forEach(sid=>{ attendance[sid]='present'; });
            allAtt.push({ id:uid(), circleId:c.id, date:d, attendance });
            added = true;
          }
        }
        d = addDaysStr(d,1);
      }
    });
    if(added){
      circleAttendanceData = allAtt;
      await storeSet(CIRCLE_ATTENDANCE_KEY, JSON.stringify(allAtt));
    }
    await storeSet('initial_attendance_seed_v1','1');

// دمج أي حلقات مكرَّرة (نفس المادة + نفس الاسم) نتجت عن إعادة بذر غير مقصودة،
// مع إعادة ربط سجلات الحضور اليتيمة بالحلقة الناجية بدل فقدانها
async function dedupeCircles(){
  try{
    if(await storeGet('circles_dedup_v2')) return;
    const latestC = await storeGet(CIRCLES_KEY);
    let all = latestC ? JSON.parse(latestC) : circlesData;
    const groups = {};
    all.forEach(c=>{
      const k = c.subject+'|'+c.topic;
      if(!groups[k]) groups[k] = [];
      groups[k].push(c);
    });
    let changed = false;
    const survivors = [];
    const idRemap = {};
    Object.values(groups).forEach(list=>{
      if(list.length === 1){ survivors.push(list[0]); return; }
      changed = true;
      const keep = list[0];
      const mergedIds = new Set(keep.studentIds||[]);
      list.slice(1).forEach(dup=>{
        (dup.studentIds||[]).forEach(id=>mergedIds.add(id));
        idRemap[dup.id] = keep.id;
      });
      keep.studentIds = Array.from(mergedIds);
      survivors.push(keep);
    });
    if(changed){
      circlesData = survivors;
      await storeSet(CIRCLES_KEY, JSON.stringify(survivors));
      const latestA = await storeGet(CIRCLE_ATTENDANCE_KEY);
      let allAtt = latestA ? JSON.parse(latestA) : circleAttendanceData;
      allAtt = allAtt.map(a => idRemap[a.circleId] ? {...a, circleId: idRemap[a.circleId]} : a);
      circleAttendanceData = allAtt;
      await storeSet(CIRCLE_ATTENDANCE_KEY, JSON.stringify(allAtt));
    }
    await storeSet('circles_dedup_v2','1');
  }catch(e){}
}

    });

  }catch(e){}
}

// ---- ٥ دوائر المواد ----
// ---- تقرير الحضور والغياب الشامل ----
// دالة مشتركة: تُرجع كل الحلقات التي لها حصص فائتة (آخر أسبوعين) ولم يُسجَّل لها حضور بعد
// circleFilterFn اختيارية لتقييد النتائج (مثلًا: حلقات مشرف معيّن فقط)
function getMissingAttendanceRows(circleFilterFn){
  const today = todayStr();
  const nowH = nowGmt4().getUTCHours();
  const schoolDayEnded = nowH >= 13; // بعد الساعة ١ ظهرًا نعتبر حصة اليوم قد انتهت
  const lookbackDays = 14;
  const rows = [];
  for(let i=0; i<lookbackDays; i++){
    const d = addDaysStr(today, -i);
    if(i===0 && !schoolDayEnded) continue; // حصة اليوم لم تنتهِ بعد، لا تُعتبر متأخرة بعد
    const wd = new Date(d+'T00:00:00Z').getUTCDay();
    circlesData.forEach(c=>{
      if(circleFilterFn && !circleFilterFn(c)) return;
      const days = SUBJECT_DAYS[c.subject];
      if(!days || !days.includes(wd)) return;
      const hasRecord = circleAttendanceData.some(a=>a.circleId===c.id && a.date===d);
      if(!hasRecord) rows.push({ circle:c, date:d });
    });
  }
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  return { rows, schoolDayEnded };
}

      ? '<div class="empty">✅ لا توجد حلقات متأخرة — كل الحلقات مسجَّلة.</div>'
      : '<div class="empty">لم ينتهِ الدوام بعد اليوم.</div>';

        + '</div>';

  // ٢) سجل الغياب الكامل عبر كل الحلقات، الأحدث أولًا
  const absenceRows = [];
  circleAttendanceData.forEach(a=>{
    const c = circlesData.find(x=>x.id===a.circleId);

  const filterFrom = window.__attFilterFrom || '';

function bindExamScoresPage(){

    saveBtn.addEventListener('click', async ()=>{
      const form = testForms.find(f=>f.id===currentExamId);
      if(!form) return;
      let changed = false;
      document.querySelectorAll('[data-grade-stu]').forEach(inp=>{
        const sid = inp.getAttribute('data-grade-stu');
        const raw = inp.value.trim();
        if(raw === '') return;
        let g = parseFloat(raw);
        if(isNaN(g)) return;
        if(g > form.total) g = form.total;
        if(g < 0) g = 0;
        const existing = testGrades.find(x=>x.formId===form.id && x.studentId===sid);
        if(existing){ existing.grade = g; existing.date = todayStr(); existing.ownerKey = supQKey(); }
        else { testGrades.push({ id:uid(), formId:form.id, studentId:sid, grade:g, date:todayStr(), ownerKey:supQKey() }); }
        changed = true;
      });
      let ok = true;
      if(changed) ok = await saveTestGrades();
      toastSave(ok, '✅ تم حفظ الدرجات');
      render();
    });
  }
  const delBtn = document.getElementById('deleteExamBtn');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{

        + (isAdmin ? '<button id="delCircleBtn" class="btn btn-danger">🗑️ حذف الحلقة</button>' : '')

async function updateCircleStudentIds(circleId, newStudentIds){
  let ok = false;
  try{
    const latest = await storeGet(CIRCLES_KEY);
    const all = latest ? JSON.parse(latest) : circlesData;
    const target = all.find(x=>x.id===circleId);
    if(target) target.studentIds = newStudentIds;
    circlesData = all;
    ok = !!(await storeSet(CIRCLES_KEY, JSON.stringify(all)));
  }catch(e){
    const target = circlesData.find(x=>x.id===circleId);
    if(target) target.studentIds = newStudentIds;
    ok = await saveCirclesRaw();
  }
  return ok;
}

function bindCircleAttendanceForm(){
  bindCommon();
  const c = circlesData.find(x=>x.id===currentCircleId);
  if(c){ (c.studentIds||[]).forEach(id=>{ if(!circleAttendanceMarks[id]) circleAttendanceMarks[id]='present'; }); }

  const searchInput = document.getElementById('att_search');
  const suggBox = document.getElementById('attSuggestions');
  if(searchInput && suggBox && c){
    const roster = (c.studentIds||[]).map(id=>students.find(x=>x.id===id)).filter(Boolean);

    function renderAttSuggestions(){
      const q = (searchInput.value||'').trim();
      if(!q){ suggBox.style.display='none'; suggBox.innerHTML=''; return; }
      const matches = roster.filter(st=>st.name.trim().startsWith(q))
        .sort((a,b)=>a.name.localeCompare(b.name,'ar'))
        .slice(0,8);
      if(!matches.length){ suggBox.style.display='none'; suggBox.innerHTML=''; return; }
      suggBox.innerHTML = matches.map(st=>'<div data-sugg-student="'+st.id+'" style="padding:9px 12px;cursor:pointer;text-align:right;border-bottom:1px solid var(--border);font-size:13px;">'+escapeHtml(st.name)+'</div>').join('');
      suggBox.style.display = 'block';
      suggBox.querySelectorAll('[data-sugg-student]').forEach(el=>{
        el.addEventListener('mousedown', ev=>{
          ev.preventDefault();
          const sid = el.getAttribute('data-sugg-student');
          searchInput.value = '';
          suggBox.style.display = 'none';
          suggBox.innerHTML = '';
          const row = document.getElementById('att-row-'+sid);
          if(row){
            row.scrollIntoView({behavior:'smooth', block:'center'});
            row.style.background = 'var(--teal-pale)';
            setTimeout(()=>{ row.style.background = ''; }, 1400);
          }
        });
      });
    }

    searchInput.addEventListener('input', renderAttSuggestions);
    searchInput.addEventListener('focus', renderAttSuggestions);
    searchInput.addEventListener('blur', ()=>{ setTimeout(()=>{ suggBox.style.display='none'; }, 150); });
  }

  document.querySelectorAll('[data-att-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-att-btn');
      const val = btn.getAttribute('data-val');
      circleAttendanceMarks[id] = val;
      render();
    });
  });
  document.querySelectorAll('[data-excuse-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-excuse-btn');
      const val = btn.getAttribute('data-val');
      circleAttendanceMarks[id] = val;
      render();
    });
  });
  const saveBtn = document.getElementById('saveCircleAttBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const date = document.getElementById('att_date').value;
      const record = { id:uid(), circleId:currentCircleId, date, attendance:{...circleAttendanceMarks} };
      let ok = false;
      try{
        const latest = await storeGet(CIRCLE_ATTENDANCE_KEY);
        const all = latest ? JSON.parse(latest) : circleAttendanceData.slice();
        all.push(record);
        circleAttendanceData = all;
        ok = !!(await storeSet(CIRCLE_ATTENDANCE_KEY, JSON.stringify(all)));
      }catch(e){
        circleAttendanceData.push(record);
        ok = await storeSet(CIRCLE_ATTENDANCE_KEY, JSON.stringify(circleAttendanceData));
      }
      // إضافة ملاحظة حضور في صفحة كل طالب
      if(c){
        const sub = getSubject(c.subject);
        (c.studentIds||[]).forEach(studentId=>{
          const status = circleAttendanceMarks[studentId] || 'absent';
          const statusText = status === 'present' ? 'حضر' : 'غاب';
          const noteContent = statusText + ' حصة ' + sub.label + ' — ' + escapeHtml(c.topic);
          records.push({ id:uid(), studentId, category:'notes', date, content:noteContent, isAttendance:true });
        });
        await saveRecords();
      }
      toastSave(ok,'✅ تم حفظ الحضور وتسجيله في صفحات الطلاب');
      currentView='circleDetail'; render();
    });
  }
}

// يبني ملف HTML مستقل كامل يحوي كل ذكريات الصيف مرتبة بدقة + كبسولة زمن مقفلة تُفتح تلقائيًا عند تاريخ محدد
function buildSummerMemoriesFile(){
  const logoSrc = document.querySelector('header img') ? document.querySelector('header img').src : '';
  const creationDate = fmtDate(todayStr());

  // كل الذكريات في تسلسل زمني واحد متواصل، دون أي تقسيم أو عناوين أسابيع
  const allItems = summerMemories.slice().sort((a,b)=>{
    if(a.date !== b.date) return a.date.localeCompare(b.date);
    if((a.hour||0) !== (b.hour||0)) return (a.hour||0) - (b.hour||0);
    return (a.minute||0) - (b.minute||0);
  });

  // بيانات كل ذكرى تُضمَّن في الملف نفسه لتُستخدم في صفحة تفاصيل الصورة عند النقر
  const itemsForJs = JSON.stringify(allItems.map(m=>({
    title: m.title, photo: m.photo,
    meta: fmtDate(m.date) + (m.hour ? ' — الساعة '+toAR(m.hour)+':'+toAR(String(m.minute||0).padStart(2,'0')) : '')

function renderEventsCalendar(){
  const _nav = renderNavBar(null);
  const now = todayStr();

  if(window.__calYear == null){
    const t = new Date(now+'T00:00:00Z');
    window.__calYear = t.getUTCFullYear();
    window.__calMonth = t.getUTCMonth();
  }
  const year = window.__calYear, month = window.__calMonth;

  const daysInMonth = new Date(Date.UTC(year, month+1, 0)).getUTCDate();
  const startWeekday = new Date(Date.UTC(year, month, 1)).getUTCDay(); // 0=الأحد .. 6=السبت

  const eventsByDate = {};
  eventsData.forEach(e=>{
    if(!eventsByDate[e.date]) eventsByDate[e.date] = [];
    eventsByDate[e.date].push(e);
  });

  const dayHeaders = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const headerCells = dayHeaders.map((d,i)=>
    '<div style="text-align:center;font-size:11px;font-weight:bold;padding:8px 2px;'
    + (i===5 ? 'background:var(--gold);color:#fff;' : 'background:var(--teal-dark);color:#fff;')
    + '">'+d+'</div>'
  ).join('');

  let dayCells = '';
  for(let i=0;i<startWeekday;i++) dayCells += '<div></div>';
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dayEvents = eventsByDate[dateStr] || [];
    const weekday = new Date(Date.UTC(year,month,day)).getUTCDay();
    const isFriday = weekday===5;
    const isPast = dateStr < now;
    const isToday = dateStr === now;

    let inner = '<div style="font-size:13px;font-weight:900;color:'+(isToday?'var(--gold)':'var(--teal-dark)')+';">'+day+'</div>';
    dayEvents.forEach(e=>{
      const t = EVENT_TYPES[e.type] || {color:'#888', icon:'📋'};
      const label = escapeHtml(e.location || e.title);
      const stackedLabel = label.split(' ').join('<br>');
      inner += '<div data-open-event="'+e.id+'" style="cursor:pointer;margin-top:3px;font-size:9px;font-weight:bold;color:#fff;background:'+t.color+';border-radius:5px;padding:3px 2px;line-height:1.35;white-space:normal;word-break:break-word;opacity:'+(isPast?'0.5':'1')+';">'+t.icon+'<br>'+stackedLabel+'</div>';
    });

    dayCells += '<div style="min-height:58px;border-radius:8px;padding:4px 3px;text-align:center;'
      + (isFriday ? 'background:var(--teal-pale);' : 'background:#fff;border:1px solid var(--border);')
      + (isToday ? 'box-shadow:inset 0 0 0 2px var(--gold);' : '')
      + '">'+inner+'</div>';
  }

  return _nav
    + '<div class="card">'
    +   '<div class="student-header"><h2>🗓️ البرامج</h2>'+(editMode ? '<button class="btn btn-gold" data-go="eventForm">+ إضافة فعالية</button>' : '')+'</div>'
    +   '<div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px;">'
    +     '<button data-cal-nav="-1" class="btn btn-outline" style="padding:4px 14px;">›</button>'
    +     '<div style="font-weight:900;color:var(--teal-dark);font-size:16px;">'+MONTH_NAMES_AR[month]+' '+year+'</div>'
    +     '<button data-cal-nav="1" class="btn btn-outline" style="padding:4px 14px;">‹</button>'
    +   '</div>'
    +   '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;">'+headerCells+'</div>'
    +   '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">'+dayCells+'</div>'
    + '</div>';
}

async function compressImage(file){
  return new Promise(resolve=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX=400; let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.6));
      URL.revokeObjectURL(url);
    };
    img.src=url;
  });
}

// ضغط بجودة أعلى بكثير — خاص بذكريات الصيف تحديدًا (ملف احتفالي يستحق دقة أفضل من القوائم العادية)
async function compressMemoryImage(file){
  return new Promise(resolve=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX=1280; let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.9));
      URL.revokeObjectURL(url);
    };
    img.src=url;
  });
}

function renderGroupAchievementsReport(){

  const allNames = [];
  if(g.leader) allNames.push({ role:'القائد', name:g.leader });

  (g.members||[]).forEach((m,i)=>allNames.push({ role:`عضو ${i+1}`, name:m }));

  const rows = allNames.map(entry=>{
    const st = findStudentByName(entry.name);
    const tracks = st ? getStudentTracks(st.id).filter(t=>isTrackComplete(t)) : [];

      ? Array.from(new Set(tracks.map(t=> trackAmountIsFullJuzAmma(t) ? 'جزء ٣٠' : t.amount)))

      + '<span style="font-weight:bold;color:var(--teal-dark);">'+escapeHtml(entry.name)+'</span>'
      + '<span>'+badges+'</span>'
      + '</div>';
  }).join('');

  return `

      currentView = 'studentDetail';
      render();
    });
  });
  const myPageBtn = document.getElementById('myPageBtn');
  if(myPageBtn){
    myPageBtn.addEventListener('click', ()=>{
      currentStudentId = currentUser.studentId;
      currentView = 'studentDetail';
      showFollowMenu = false;
      render();
    });
  }
}

function bindListView(){
  bindCommon();
  const input = document.getElementById('searchInput');
  input.addEventListener('input', e=>{
    window.__searchTerm = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const ni = document.getElementById('searchInput');
    ni.focus();
    ni.selectionStart = ni.selectionEnd = pos;
  });
  document.querySelectorAll('.student-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.getAttribute('data-id');
      if(currentUser?.role==='student' && id !== currentUser.studentId){
        showToast('لا يمكنك فتح صفحة زميل — يمكنك الاطلاع على القائمة فقط');
        return;
      }
      currentStudentId = id;
      currentView = 'studentDetail';
      showFollowMenu = false;
      render();
    });
  });
}

function bindStudentForm(){
  bindCommon();
  document.getElementById('saveStudentBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('الاسم مطلوب'); return; }
    const data = {
      name,
      grade: document.getElementById('f_grade').value.trim(),
      school: document.getElementById('f_school').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      guardianPhone: document.getElementById('f_guardianPhone') ? document.getElementById('f_guardianPhone').value.trim() : (students.find(x=>x.id===editingStudentId)?.guardianPhone || ''),
      academicYear: document.getElementById('f_academicYear').value.trim(),
      address: document.getElementById('f_address').value.trim(),
    };
    if(editingStudentId){
      const idx = students.findIndex(s=>s.id===editingStudentId);
      students[idx] = {...students[idx], ...data};
      const ok = await saveStudents();
      toastSave(ok, 'تم حفظ التعديلات');
      currentStudentId = editingStudentId;
      currentView='studentDetail';
    } else {
      const maxNum = students.reduce((m,s)=>Math.max(m, s.studentNumber||0), 0);
      const newS = {id:uid(), studentNumber: maxNum+1, ...data};
      students.push(newS);
      const ok = await saveStudents();
      toastSave(ok, 'تم إضافة الطالب');
      currentView='list';
    }
    editingStudentId=null;
    render();
  });
  const delBtn = document.getElementById('deleteStudentBtn');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(currentUser?.role !== 'admin'){ showToast('هذا الإجراء متاح لمدير النظام فقط'); return; }
      if(confirm('هل أنت متأكد من حذف هذا الطالب وكل سجلاته؟')){
        students = students.filter(s=>s.id!==editingStudentId);
        records = records.filter(r=>r.studentId!==editingStudentId);
        const ok1 = await saveStudents();
        const ok2 = await saveRecords();
        toastSave(ok1 && ok2, 'تم حذف الطالب');
        editingStudentId=null;
        currentView='list';
        render();
      }
    });
  }
}

function bindStudentDetail(){
  bindCommon();
  const editBtn = document.querySelector('[data-edit]');
  if(editBtn){
    editBtn.addEventListener('click', ()=>{
      editingStudentId = editBtn.getAttribute('data-edit');
      currentView='studentForm';
      render();
    });
  }
  const delDirectBtn = document.querySelector('[data-delete-direct]');
  if(delDirectBtn){
    delDirectBtn.addEventListener('click', async ()=>{
      if(currentUser?.role !== 'admin'){ showToast('هذا الإجراء متاح لمدير النظام فقط'); return; }
      const id = delDirectBtn.getAttribute('data-delete-direct');
      if(confirm('هل أنت متأكد من حذف بيانات هذا الطالب وكل سجلاته؟ لا يمكن التراجع عن هذا الإجراء.')){
        students = students.filter(s=>s.id!==id);
        records = records.filter(r=>r.studentId!==id);
        const ok1 = await saveStudents();
        const ok2 = await saveRecords();
        toastSave(ok1 && ok2, 'تم حذف بيانات الطالب نهائياً');
        currentView='list';
        render();
      }
    });
  }
  document.querySelectorAll('[data-myrole]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentRoleKey = el.getAttribute('data-myrole');
      currentView = 'roleDetail';
      render();
    });
  });
  document.querySelectorAll('.section-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-cat');
      if(key === 'reports'){ currentView = 'studentReports'; render(); return; }
      currentCategory = key;
      currentView = 'category';
      render();
    });
  });
}

function bindCategoryView(){
  bindCommon();
  document.querySelectorAll('[data-myrole]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentRoleKey = el.getAttribute('data-myrole');
      currentView = 'roleDetail';
      render();
    });
  });
  document.querySelectorAll('[data-juz-range]').forEach(el=>{
    el.addEventListener('click', ()=>{
      window.__juzRangeIndex = parseInt(el.getAttribute('data-juz-range'));
      window.__openJuzBox = null;
      currentView = 'quranJuzRange';
      render();
    });
  });
  document.querySelectorAll('[data-del-record]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-del-record');
      if(confirm('حذف هذا السجل؟')){
        records = records.filter(r=>r.id!==id);
        const ok = await saveRecords();
        toastSave(ok, 'تم حذف السجل');
        render();
      }
    });
  });
}

function bindEntryForm(){
  bindCommon();
  let ratingValue = 3;
  const starsGroup = document.querySelector('.stars');
  if(starsGroup){
    starsGroup.querySelectorAll('.star').forEach(star=>{
      star.addEventListener('click', ()=>{
        ratingValue = parseInt(star.getAttribute('data-val'));
        starsGroup.querySelectorAll('.star').forEach(s2=>{
          s2.classList.toggle('active', parseInt(s2.getAttribute('data-val'))<=ratingValue);
        });
      });
    });
  }
  document.getElementById('saveEntryBtn').addEventListener('click', async ()=>{
    const date = document.getElementById('e_date').value || todayStr();
    const content = document.getElementById('e_content').value.trim();
    const cat = CATEGORIES[currentCategory];
    const rec = {
      id: uid(),
      studentId: currentStudentId,
      category: currentCategory,
      date,
      content,
    };
    if(cat.rating) rec.rating = ratingValue;
    records.push(rec);
    const ok = await saveRecords();
    toastSave(ok, 'تم حفظ السجل');
    currentView='category';
    render();
  });
}
